<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Rubrica Cubo</title>
  <link rel="stylesheet" href="../CSS/style.css">
</head>
<body>

  <!-- ================================================
       SCENA PRINCIPALE — il cubo
       ================================================ -->
  <div class="scena" id="scena">
    <div class="cubo" id="cubo">

      <!-- FRONTE: form aggiungi contatto / dati contatto -->
      <div class="faccia fronte" id="faccia-fronte">
        <div class="faccia-contenuto" id="contenuto-fronte">

          <!-- Stato A: form (default) -->
          <div id="form-aggiungi">
            <h2 class="faccia-titolo">+ Contatto</h2>
            <input class="campo" type="text"  id="inp-nome"    placeholder="Nome"     maxlength="50">
            <input class="campo" type="text"  id="inp-cognome" placeholder="Cognome"  maxlength="50">
            <input class="campo" type="tel"   id="inp-tel"     placeholder="Telefono">
            <input class="campo" type="email" id="inp-email"   placeholder="Email">
            <input class="campo" type="url"   id="inp-avatar"  placeholder="Avatar URL">
            <button class="btn-salva" id="btn-salva">Salva</button>
          </div>

          <!-- Stato B: dati contatto (visibile durante modalità contatto) -->
          <div id="scheda-fronte" class="scheda nascosta">
            <div class="scheda-avatar" id="scheda-avatar-fronte"></div>
            <p class="scheda-nome" id="scheda-nome-fronte"></p>
            <button class="btn-esci" id="btn-esci">✕ Esci</button>
          </div>

        </div>
      </div>

      <!-- DIETRO: form specchiato / fronte specchiato del contatto -->
      <div class="faccia dietro" id="faccia-dietro">
        <div class="faccia-contenuto specchiato" id="contenuto-dietro">

          <!-- Stato A: form specchiato (default) -->
          <div id="form-aggiungi-b">
            <h2 class="faccia-titolo">+ Contatto</h2>
            <input class="campo" type="text"  id="inp-nome-b"    placeholder="Nome"     maxlength="50">
            <input class="campo" type="text"  id="inp-cognome-b" placeholder="Cognome"  maxlength="50">
            <input class="campo" type="tel"   id="inp-tel-b"     placeholder="Telefono">
            <input class="campo" type="email" id="inp-email-b"   placeholder="Email">
            <input class="campo" type="url"   id="inp-avatar-b"  placeholder="Avatar URL">
            <button class="btn-salva" id="btn-salva-b">Salva</button>
          </div>

          <!-- Stato B: riflesso specchiato del fronte -->
          <div id="scheda-dietro" class="scheda nascosta">
            <div class="scheda-avatar" id="scheda-avatar-dietro"></div>
            <p class="scheda-nome" id="scheda-nome-dietro"></p>
          </div>

        </div>
      </div>

      <!-- DESTRA: lista contatti -->
      <div class="faccia destra" id="faccia-destra">
        <div class="faccia-contenuto" id="contenuto-destra">
          <h2 class="faccia-titolo">Contatti</h2>
          <ul class="lista-contatti" id="lista-contatti"></ul>
        </div>
      </div>

      <!-- SINISTRA: cerca / telefono contatto -->
      <div class="faccia sinistra" id="faccia-sinistra">
        <div class="faccia-contenuto" id="contenuto-sinistra">

          <!-- Stato A: ricerca (default) -->
          <div id="form-ricerca">
            <h2 class="faccia-titolo">Cerca</h2>
            <input class="campo" type="text" id="inp-ricerca" placeholder="Nome o Cognome...">
            <ul class="lista-contatti" id="lista-ricerca"></ul>
          </div>

          <!-- Stato B: telefono contatto -->
          <div id="scheda-sinistra" class="scheda nascosta">
            <p class="scheda-label">📞 Telefono</p>
            <p class="scheda-valore" id="scheda-tel"></p>
          </div>

        </div>
      </div>

      <!-- SOPRA: logo / avatar contatto -->
      <div class="faccia sopra" id="faccia-sopra">
        <div class="faccia-contenuto" id="contenuto-sopra">
          <h1 class="logo-titolo">📒 Rubrica</h1>
        </div>
      </div>

      <!-- SOTTO: firma / avatar specchiato contatto -->
      <div class="faccia sotto" id="faccia-sotto">
        <div class="faccia-contenuto" id="contenuto-sotto">
          <p class="firma">Developed by</p>
          <p class="firma-nome">Luca Foglia</p>
          <p class="firma-corso">WSA · ITS Piazza dei Mestieri</p>
          <p class="firma-anno">Torino · 2026</p>
        </div>
      </div>

    </div><!-- fine .cubo -->
  </div><!-- fine .scena -->


  <!-- ================================================
       RIGA MINI-CUBI — appare dopo l'esplosione
       Vive fuori dalla scena per evitare distorsioni
       ================================================ -->
  <div class="riga-mini" id="riga-mini"></div>


  <script src="../JS/script.js"></script>
</body>
</html>
